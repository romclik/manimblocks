     name: Build installer (test build)
     on:
       push:
       workflow_dispatch:
     jobs:
       installer:
         runs-on: windows-latest
         timeout-minutes: 30
         steps:
           - uses: actions/checkout@v4
           - uses: actions/setup-node@v4
             with:
               node-version: 22
               cache: npm
           - run: npm ci
           - run: node scripts/get-uv.mjs --strict
           - run: npm run build
           - run: npx electron-builder --win --publish never
           - uses: actions/upload-artifact@v4
             with:
               name: ManimBlocks-installer
               path: |
                 release/*.exe
                 release/latest.yml
               retention-days: 14
