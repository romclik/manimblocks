     name: E2E (real install and render)
     on:
       push:
       workflow_dispatch:
     jobs:
       e2e-windows:
         runs-on: windows-latest
         timeout-minutes: 40
         steps:
           - uses: actions/checkout@v4
           - uses: actions/setup-node@v4
             with:
               node-version: 22
               cache: npm
           - run: npm ci
           - run: node scripts/get-uv.mjs --strict
           - run: npm run test:e2e
